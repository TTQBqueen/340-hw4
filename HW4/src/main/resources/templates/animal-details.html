<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:form="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
<link href="details.css" rel="stylesheet">
    <title>animal List</title>
</head>
<body>

<div class = 'card'>
    <p id = "id" data-th-text=" 'ID: '+ ${animal.animalId}"></p>
    <h1 data-th-text="${animal.name}"></h1>
    <p  data-th-text="${animal.scientificName}"></p>
    <p data-th-text="${animal.classification}"></p>
    <p data-th-text="${animal.habitat}"></p>
    <p data-th-text="${animal.description}"></p>
    <a href="/animals/all" class="btn btn-primary">Go back</a>
</div>

</body>
<style>
    body {
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.card {
    background-color: #fff;
    border-radius: 15px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    padding: 25px;
    margin: 20px;
    height: 400px;
    width: 500px;
    /* transition: transform 0.3s ease, box-shadow 0.3s ease; */
}

.card:hover {
    /* transform: translateY(-10px); */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.card h1 {
    font-size: 26px;
    color: #2c3e50;
    margin-bottom: 15px;
    text-align: center;
}

.card p {
    font-size: 16px;
    color: #7f8c8d;
    margin: 8px 0;
    text-align: center;
    margin-top: 5%;
}

.card p:nth-of-type(2) {
    font-style: italic;
    font-weight: bold;
    color: #b92937;
    font-size:20px;
}

#id {
    text-align: left;
    font-size: 20px;
    color: #2980b9;
    font-style: italic;
    font-weight: bold;
}
</style>

</html>
