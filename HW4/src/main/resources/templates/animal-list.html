<!DOCTYPE html>
<html lang="en">
<head>
<!--  displays a list of animals  -->
    <meta charset="UTF-8">
    <title>Animals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="/styles/styles.css" type="text/css" rel="stylesheet">

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e3f2fd;">
    <a class="navbar-brand" href="/animals/all">
      <img src="/images/logo.jpg" alt="" width="80" height="60">
    </a>
    <ul class="nav justify-content-end">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/animals/all">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Second</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Third</a>
        </li>
    </ul>
</nav>


<!--${} accuess modle atributes-->

<div class="container">
    <a href ="animals/createForm">Creat new aimal</a>

    <form action="/animals">
        <input id = "search" type="text" name="name" placeholder="Search By Name &#128270;">
    </form>
    <table class="table table-striped">
        <tr>
            <th>ID</th>
            <th>name</th>
            <th>Scientific Name</th>
            <th>Classification</th>
            <th>Habitat</th>
            <th>Description</th>
        </tr>

    <tr data-th-each="animal: ${animalList}">
        <td><a data-th-href="@{/animals/{animalId}(animalId=${animal.animalId})}" data-th-text="${animal.animalId}"></a></td>
        <td data-th-text="${animal.name}"></td>
        <td  data-th-text="${animal.scientificName}"></td>
        <td data-th-text="${animal.classification}"></td>
        <td data-th-text="${animal.habitat}"></td>
        <td data-th-text="${animal.description}"></td>
    </tr>

    </table>



</div>
</body>
</html>
